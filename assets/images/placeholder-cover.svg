<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="45%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Ambient glowing orbs -->
  <circle cx="120" cy="90" r="160" fill="#0284c7" opacity="0.18" />
  <circle cx="720" cy="380" r="210" fill="#06b6d4" opacity="0.15" />
  <circle cx="680" cy="90" r="130" fill="#8b5cf6" opacity="0.12" />

  <!-- WebApp Window Mockup -->
  <g transform="translate(160, 45)" filter="url(#cardGlow)">
    <!-- Browser Container -->
    <rect width="480" height="280" rx="16" fill="url(#windowGrad)" stroke="#334155" stroke-width="2" />
    
    <!-- Window Header -->
    <rect width="480" height="42" rx="16" fill="#1e293b" />
    <rect y="26" width="480" height="16" fill="#1e293b" />
    <line x1="0" y1="42" x2="480" y2="42" stroke="#334155" stroke-width="1.5" />

    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b" />
    <circle cx="60" cy="21" r="5.5" fill="#10b981" />

    <!-- URL Bar -->
    <rect x="90" y="10" width="300" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="240" y="25" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">https://student-innovators.web.app</text>

    <!-- App Content Grid -->
    <!-- Card 1: Code / Dev -->
    <rect x="24" y="62" width="130" height="95" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="50" cy="92" r="16" fill="#0284c7" opacity="0.25" />
    <text x="50" y="98" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">&lt;/&gt;</text>
    <text x="76" y="90" fill="#f1f5f9" font-family="'Prompt', sans-serif" font-size="12" font-weight="600">Web App</text>
    <text x="76" y="106" fill="#64748b" font-family="'Prompt', sans-serif" font-size="10">Learning Tool</text>
    <rect x="36" y="125" width="105" height="4" rx="2" fill="#334155" />
    <rect x="36" y="135" width="70" height="4" rx="2" fill="#0284c7" />

    <!-- Card 2: Health / Life -->
    <rect x="175" y="62" width="130" height="95" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="201" cy="92" r="16" fill="#10b981" opacity="0.25" />
    <text x="201" y="98" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="16">♥</text>
    <text x="227" y="90" fill="#f1f5f9" font-family="'Prompt', sans-serif" font-size="12" font-weight="600">Health App</text>
    <text x="227" y="106" fill="#64748b" font-family="'Prompt', sans-serif" font-size="10">Wellness Calc</text>
    <rect x="187" y="125" width="105" height="4" rx="2" fill="#334155" />
    <rect x="187" y="135" width="80" height="4" rx="2" fill="#10b981" />

    <!-- Card 3: Math / Science -->
    <rect x="326" y="62" width="130" height="95" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="352" cy="92" r="16" fill="#f59e0b" opacity="0.25" />
    <text x="352" y="98" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="16" font-weight="bold">∑</text>
    <text x="378" y="90" fill="#f1f5f9" font-family="'Prompt', sans-serif" font-size="12" font-weight="600">Calculator</text>
    <text x="378" y="106" fill="#64748b" font-family="'Prompt', sans-serif" font-size="10">Science &amp; Math</text>
    <rect x="338" y="125" width="105" height="4" rx="2" fill="#334155" />
    <rect x="338" y="135" width="60" height="4" rx="2" fill="#f59e0b" />

    <!-- Bottom Showcase Banner in Window -->
    <rect x="24" y="176" width="432" height="82" rx="10" fill="#131e33" stroke="#1e293b" stroke-width="1" />
    <circle cx="65" cy="217" r="22" fill="url(#accentGrad)" opacity="0.9" />
    <text x="65" y="223" text-anchor="middle" fill="#ffffff" font-size="20">🚀</text>
    <text x="105" y="210" fill="#ffffff" font-family="'Prompt', system-ui, sans-serif" font-size="15" font-weight="700">Hongson Student Innovators</text>
    <text x="105" y="230" fill="#94a3b8" font-family="'Prompt', system-ui, sans-serif" font-size="12">พื้นที่จัดแสดง Web App ทุกรูปแบบที่นักเรียนสร้างสรรค์</text>
  </g>

  <!-- Title Bottom Text -->
  <text x="400" y="375" text-anchor="middle" fill="#f1f5f9" font-family="'Prompt', 'Kanit', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">
    Hongson Student Innovators
  </text>
  <text x="400" y="405" text-anchor="middle" fill="#94a3b8" font-family="'Prompt', 'Kanit', system-ui, sans-serif" font-size="14">
    ภาพหน้าปกผลงาน / ตัวอย่างหน้าจอเว็บแอปพลิเคชัน
  </text>
</svg>
